<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Tool Finder</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: Canvas;
    color: CanvasText;
    overflow: hidden;
  }
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  .top {
    padding: 12px;
    border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
  }
  .search-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  input {
    width: 100%;
    border: 1px solid color-mix(in srgb, CanvasText 24%, transparent);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 16px;
    outline: none;
    background: Field;
    color: FieldText;
  }
  input:focus { border-color: Highlight; }
  button {
    border: 1px solid color-mix(in srgb, CanvasText 24%, transparent);
    border-radius: 8px;
    padding: 0 12px;
    background: ButtonFace;
    color: ButtonText;
    cursor: pointer;
  }
  .hint { margin-top: 7px; font-size: 12px; opacity: .65; }
  .list { overflow: auto; padding: 6px; }
  .item {
    padding: 9px 10px;
    border-radius: 7px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .item:hover, .item.active {
    background: color-mix(in srgb, Highlight 16%, transparent);
    border-color: color-mix(in srgb, Highlight 35%, transparent);
  }
  .name { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .meta { margin-top: 3px; font-size: 11px; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    border-top: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
    font-size: 11px;
    opacity: .7;
  }
  .empty { padding: 24px 12px; text-align: center; opacity: .6; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="search-row">
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search tool… e.g. make box">
      <button id="refresh" title="Rescan commands">↻</button>
    </div>
    <div class="hint">Type to filter · ↑/↓ move · Enter runs · Esc closes</div>
  </div>
  <div id="list" class="list"></div>
  <div class="footer"><span id="count">0 commands</span><span>Quick Tool Finder v0.1.0</span></div>
</div>
<script>
(() => {
  let commands = [];
  let filtered = [];
  let activeIndex = 0;
  const q = document.getElementById('q');
  const list = document.getElementById('list');
  const count = document.getElementById('count');

  function normalize(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function searchable(c) {
    return normalize([c.name, c.tooltip, c.status, c.extension, c.source, c.toolbar].join(' '));
  }

  function score(c, query) {
    if (!query) return 0;
    const name = normalize(c.name);
    const all = c._search;
    if (name === query) return 1000;
    if (name.startsWith(query)) return 850 - name.length;
    const word = name.split(/\s+/).findIndex(w => w.startsWith(query));
    if (word >= 0) return 700 - word;
    const pos = name.indexOf(query);
    if (pos >= 0) return 600 - pos;
    const allPos = all.indexOf(query);
    if (allPos >= 0) return 400 - allPos;

    let qi = 0;
    let gap = 0;
    for (let i = 0; i < name.length && qi < query.length; i++) {
      if (name[i] === query[qi]) qi++;
      else if (qi > 0) gap++;
    }
    return qi === query.length ? 200 - gap : -1;
  }

  function render() {
    const query = normalize(q.value.trim());
    const ranked = [];
    for (const c of commands) {
      const s = score(c, query);
      if (!query || s >= 0) ranked.push([s, c]);
    }
    ranked.sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name));
    filtered = ranked.slice(0, 80).map(x => x[1]);
    activeIndex = Math.min(activeIndex, Math.max(0, filtered.length - 1));

    if (!filtered.length) {
      list.innerHTML = '<div class="empty">No matching command.</div>';
    } else {
      list.innerHTML = filtered.map((c, i) => {
        const meta = [c.extension, c.toolbar, c.tooltip].filter(Boolean).join(' · ');
        return `<div class="item ${i === activeIndex ? 'active' : ''}" data-i="${i}">
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="meta">${escapeHtml(meta)}</div>
        </div>`;
      }).join('');
    }
    count.textContent = `${filtered.length} / ${commands.length} commands`;
    ensureActiveVisible();
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function ensureActiveVisible() {
    const el = list.querySelector('.item.active');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  function run(index = activeIndex) {
    const c = filtered[index];
    if (!c) return;
    window.sketchup.run(c.id);
  }

  q.addEventListener('input', () => { activeIndex = 0; render(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); activeIndex = Math.min(activeIndex + 1, filtered.length - 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activeIndex = Math.max(activeIndex - 1, 0); render(); }
    else if (e.key === 'Enter') { e.preventDefault(); run(); }
    else if (e.key === 'Escape') { e.preventDefault(); window.close(); }
  });

  list.addEventListener('click', e => {
    const item = e.target.closest('.item');
    if (!item) return;
    run(Number(item.dataset.i));
  });

  document.getElementById('refresh').addEventListener('click', () => window.sketchup.refresh());

  window.setCommands = data => {
    commands = (data || []).map(c => Object.assign(c, { _search: searchable(c) }));
    activeIndex = 0;
    render();
    q.focus();
    q.select();
  };

  window.addEventListener('load', () => window.sketchup.ready());
})();
</script>
</body>
</html>
